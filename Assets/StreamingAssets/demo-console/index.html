<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Lamp — Directing Console</title>
<style>
  :root {
    --bg:        #150f0b;
    --bg-glow:   #2a1c10;
    --surface:   rgba(38, 27, 19, 0.72);
    --surface-2: rgba(48, 35, 24, 0.6);
    --line:      rgba(232, 170, 90, 0.16);
    --line-soft: rgba(232, 170, 90, 0.08);
    --text:      #efe4d4;
    --muted:     #b09a83;
    --faint:     #7c6b58;
    --ember:     #e8a04a;
    --ember-hi:  #f4bd6e;
    --ember-dim: rgba(232, 160, 74, 0.14);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--bg-glow) 0%, rgba(42,28,16,0) 55%),
      radial-gradient(90% 60% at 50% 0%, rgba(232,160,74,0.10) 0%, rgba(232,160,74,0) 45%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 34px 22px 90px; }

  /* Header / lamp mark */
  .brand { text-align: center; margin: 8px 0 26px; }
  .lamp-dot {
    width: 13px; height: 13px; border-radius: 50%;
    margin: 0 auto 16px; background: var(--ember-hi);
    box-shadow: 0 0 8px 2px rgba(244,189,110,0.75), 0 0 26px 8px rgba(232,160,74,0.35), 0 0 60px 22px rgba(232,160,74,0.14);
    animation: breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: .78; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.12); }
  }
  .brand h1 {
    font-family: var(--serif); font-weight: 500; font-size: 30px;
    letter-spacing: 0.3px; margin: 0; color: var(--text);
  }
  .brand p { margin: 7px 0 0; color: var(--muted); font-size: 14px; font-style: italic; }

  /* Stepper */
  .steps { display: flex; justify-content: center; gap: 6px; margin: 0 0 30px; flex-wrap: wrap; }
  .step {
    font-size: 12.5px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--faint); background: transparent; border: 1px solid transparent;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: all .25s ease;
    font-family: var(--sans);
  }
  .step:hover { color: var(--muted); }
  .step.active {
    color: #1a1109; background: linear-gradient(180deg, var(--ember-hi), var(--ember));
    box-shadow: 0 0 18px rgba(232,160,74,0.35); font-weight: 600;
  }
  .step .n { opacity: .6; margin-right: 7px; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px 24px; margin: 0 0 18px;
    backdrop-filter: blur(3px);
  }
  .card h2 {
    font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 0 0 4px;
  }
  .card .lead { color: var(--muted); font-size: 14px; margin: 0 0 20px; font-style: italic; }

  .q { margin: 0 0 18px; }
  .q label {
    display: block; font-family: var(--serif); font-size: 16.5px; color: var(--ember-hi);
    margin: 0 0 8px; font-style: italic;
  }
  textarea, input[type=text] {
    width: 100%; font-family: var(--sans); font-size: 15px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 11px 13px; resize: vertical; line-height: 1.5;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  textarea:focus, input:focus {
    outline: none; border-color: rgba(232,160,74,0.5);
    box-shadow: 0 0 0 3px var(--ember-dim);
  }
  textarea { min-height: 62px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  button.act {
    font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: .3px;
    color: #1a1109; background: linear-gradient(180deg, var(--ember-hi), var(--ember));
    border: none; border-radius: 10px; padding: 11px 20px; cursor: pointer;
    box-shadow: 0 2px 14px rgba(232,160,74,0.28); transition: transform .12s ease, box-shadow .2s ease;
  }
  button.act:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(232,160,74,0.42); }
  button.act:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  button.ghost {
    font-family: var(--sans); font-size: 13.5px; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; cursor: pointer; transition: all .2s ease;
  }
  button.ghost:hover { color: var(--text); border-color: rgba(232,160,74,0.4); }

  .followup {
    margin-top: 14px; padding: 15px 16px; border-left: 2px solid var(--ember);
    background: var(--ember-dim); border-radius: 0 10px 10px 0;
  }
  .followup .fq { font-family: var(--serif); font-style: italic; color: var(--ember-hi); font-size: 16px; margin-bottom: 9px; }

  .compiled { margin-top: 16px; padding: 15px 16px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line-soft); }
  .compiled .k { font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
  .compiled .v { font-family: var(--serif); font-size: 15.5px; color: var(--text); margin-bottom: 12px; line-height: 1.5; }
  .compiled .v:last-child { margin-bottom: 0; }

  .hint { color: var(--faint); font-size: 13px; margin-top: 10px; line-height: 1.55; }
  .status { color: var(--ember); font-size: 13px; min-height: 18px; margin-top: 10px; font-style: italic; }

  /* Expression vocabulary */
  .vocab { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
  .vocab .lbl input { width: 100%; }
  .vocab .mem { color: var(--faint); font-size: 13px; font-family: var(--sans); white-space: nowrap; }

  /* Stage */
  .stage-bar { display: flex; gap: 10px; margin-bottom: 8px; }
  .stage-bar input { flex: 1; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 2px 0 20px; }
  .meta b { color: var(--ember-hi); font-weight: 500; font-family: var(--serif); font-style: italic; }

  .feed { display: flex; flex-direction: column; gap: 2px; }
  .turn {
    padding: 16px 0; border-bottom: 1px solid var(--line-soft);
    animation: rise .5s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .turn .said { color: var(--muted); font-size: 14.5px; margin-bottom: 9px; }
  .turn .said .who { color: var(--faint); font-size: 11.5px; letter-spacing: .7px; text-transform: uppercase; margin-right: 8px; }
  .turn .did {
    font-family: var(--serif); font-style: italic; color: var(--ember-hi); font-size: 15px;
    margin-bottom: 7px; padding-left: 14px; border-left: 2px solid var(--ember);
  }
  .turn .why { font-family: var(--serif); color: var(--text); font-size: 16px; line-height: 1.6; padding-left: 14px; }
  .empty { color: var(--faint); font-style: italic; font-family: var(--serif); text-align: center; padding: 40px 0; font-size: 16px; }

  .footer { text-align: center; margin-top: 26px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/preact.js"></script>
  <script src="./vendor/preact-hooks.js"></script>
  <script src="./vendor/htm.js"></script>
  <script src="./app.js"></script>
</body>
</html>
